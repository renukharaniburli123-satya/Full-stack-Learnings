<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            height: 200px;
            width: 200px;
            background-color: aquamarine;
            position: fixed;
            top: 0px;
            left: 0px;
           
        }
        .box2{
            height: 200px;
            width: 200px;
            background-color: darkorange;
            right: 0px;
            top: 0px;
            position: fixed;
            
        }
        .box3{
            height: 200px;
            width: 200px;
            background-color: cornflowerblue;
            left: 0px;
            bottom: 0px;
            position: fixed;
           
        }
        .box4{
            height: 200px;
            width: 200px;
            background-color: fuchsia;
            right: 0px;
            bottom: 0px;
            position: fixed;
        }
    </style>
</head>
<body>
    <div class="box1">box1</div>
    <div class="box2">box2</div>
    <div class="box3">box3</div>
    <div class="box4">box4</div>
</body>
</html>
